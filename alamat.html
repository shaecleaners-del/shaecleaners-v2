<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Alamat Saya | Shae Cleaners</title>

<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/alamat.css">

<body>


<header class="topbar">

<div class="logo">

<img src="assets/img/logo.png">

<span>Alamat Saya</span>

</div>

</header>



<section class="address-page">


<h2>
Alamat Pelanggan
</h2>

id="judul"
placeholder="Nama alamat (Rumah/Kantor)"
>

id="alamat"
placeholder="Alamat lengkap">
</textarea>


<button id="btnSimpan">

Simpan Alamat

</button>


</div>



<div id="addressList">


<p>
Memuat alamat...
</p>


</div>



</section>



<script type="module" src="assets/js/alamat.js"></script>
