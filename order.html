<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pesan Layanan | Shae Cleaners</title>

<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/order.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>

<header class="topbar">

<div class="logo">

<img src="assets/img/logo.png">

<span>Shae Cleaners</span>

</div>

</header>

<section class="order-page">
<h2>Form Pemesanan</h2>
<input type="text" id="nama" placeholder="Nama Pelanggan">
<input type="tel" id="hp" placeholder="Nomor WhatsApp">
<textarea id="alamat" placeholder="Alamat Lengkap"></textarea>

<select id="layanan">
<option value="">Pilih Layanan</option>
<option value="Sofa 1 Seater|60000">Cuci Sofa 1 Seater</option>
<option value="Sofa L Standard|250000">Cuci Sofa L Standard</option>

<option value="Springbed Single|180000">Cuci Kasur Single</option>

<option value="Springbed Queen|270000">Cuci Kasur Queen</option>

<option value="Karpet /m²|13000">Cuci Karpet</option>

<option value="Home Cleaning|100000">Home Cleaning</option>

<option value="Cuci AC|75000">Cuci AC</option>

<option value="Jok Mobil|400000">Jok Mobil + Interior</option>

<option value="Gorden|35000">Cuci Gorden</option>

<option value="Kursi|35000">Cuci Kursi</option>
</select>
<input type="number"

id="qty"

placeholder="Jumlah"

value="1"

min="1">

<input type="date" id="tanggal">

<input type="time" id="jam">

<div class="summary">

<p>Harga Satuan :
<b id="harga">Rp0</b></p>

<p>Total :
<b id="total">Rp0</b></p>

<p>No Invoice :
<b id="invoice">INV-0000</b></p>

</div>
<button id="btnWA">
Pesan via WhatsApp
</button>
</section>
<script>
const layanan = document.getElementById("layanan");
const selected = localStorage.getItem("selectedService");
if(selected){
    const option = [...layanan.options]
    .find(o => o.text.includes(selected));
    if(option){
        layanan.value = option.value;
    }
}

</script>
<script type="module" src="assets/js/order.js"></script>
</body>
</html>
